name: Auto-deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: elviajero_staging_web
  STAGING_URL: https://staging.tiendaelviajero.com.py

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        run: |
          set -euo pipefail
          for secret in SUPABASE_URL SUPABASE_ANON_KEY VPS_HOST VPS_USER VPS_KEY; do
            eval "val=\${{ secrets.$secret }}"
            test -n "$val" || { echo "Missing $secret"; exit 1; }
          done

      - name: Resolve image tag
        id: image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_REPO=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_REPO}:staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REPO}:staging-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Docker Swarm (staging)
        run: |
          set -euo pipefail
          SSH_CMD="ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          NEW_IMAGE="${{ steps.image.outputs.image }}"

          echo "=== Pulling $NEW_IMAGE on VPS ==="
          $SSH_CMD "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin && docker pull '$NEW_IMAGE'"

          echo "=== Updating ${{ env.SERVICE_NAME }} ==="
          $SSH_CMD "docker service update \
            --image '$NEW_IMAGE' \
            --update-order start-first \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            '${{ env.SERVICE_NAME }}'" || echo "Service ${{ env.SERVICE_NAME }} not found — staging not set up yet"

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in {1..20}; do
            code=$(curl -L -s -o /tmp/health.json -w '%{http_code}' '${{ env.STAGING_URL }}/api/health' || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Staging health OK"
              exit 0
            fi
            echo "Health pending ($code), retry $i/20"
            sleep 10
          done
          echo "Staging health check failed"
          exit 1

  post-deploy-e2e:
    name: Post-deploy E2E
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Run E2E against staging
        run: npx playwright test --reporter=line
        env:
          E2E_BASE_URL: ${{ env.STAGING_URL }}
