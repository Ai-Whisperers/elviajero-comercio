name: Deploy to Docker Swarm

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Docker Swarm
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SERVICE_NAME="elviajero_web"
          SHORT_SHA="${{ github.sha }}"
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA:0:7}"

          echo "=== Pulling image $NEW_IMAGE on VPS ==="
          # Authenticate GHCR on VPS using GITHUB_TOKEN and pull the new image
          $SSH_CMD "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin && docker pull $NEW_IMAGE"

          echo "=== Updating service $SERVICE_NAME with image $NEW_IMAGE ==="
          # Update the service: start-first (new container starts before old stops),
          # one container at a time with a 10s delay between updates
          $SSH_CMD "docker service update \
            --image $NEW_IMAGE \
            --update-order start-first \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            $SERVICE_NAME" || {
            echo "=== Service update command finished (rolled back on failure if needed) ==="
          }

          # Wait for the rollout to stabilize
          echo "=== Waiting for rollout to stabilize (30s) ==="
          sleep 30

          # Health check: inspect running tasks for the service
          echo "=== Health check for $SERVICE_NAME ==="
          HEALTHY=$($SSH_CMD "docker service ps $SERVICE_NAME \
            --filter desired-state=Running \
            --format '{{.Name}} {{.Image | printf \"%.60s\"}} {{.CurrentState}}'" 2>&1)

          echo "$HEALTHY"

          # Check for any failing tasks
          FAILED=$($SSH_CMD "docker service ps $SERVICE_NAME \
            --filter desired-state=Running \
            --format '{{.Name}} {{.CurrentState}} {{.Err}}'" 2>&1)

          if echo "$FAILED" | grep -qi "failed\|error\|shutdown\|rejected"; then
            echo "=== HEALTH CHECK FAILED — rolling back ==="
            $SSH_CMD "docker service rollback $SERVICE_NAME"
            echo "=== Rollback initiated — previous version restored ==="
            exit 1
          fi

          echo "=== Deploy successful: $SERVICE_NAME updated to $NEW_IMAGE ==="
