name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Defaults to main.
        required: false
        default: main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: elviajero_web
  PRODUCTION_URL: https://tiendaelviajero.com.py

jobs:
  deploy:
    name: Build image and update Swarm service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Preflight required secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.SUPABASE_URL }}" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "${{ secrets.VPS_HOST }}" || { echo "Missing VPS_HOST secret"; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo "Missing VPS_USER secret"; exit 1; }
          test -n "${{ secrets.VPS_KEY }}" || { echo "Missing VPS_KEY secret"; exit 1; }

      - name: Resolve image tag
        id: image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_REPO=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_REPO}:prod-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REPO}:prod-latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Docker Swarm
        run: |
          set -euo pipefail
          SSH_CMD="ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          NEW_IMAGE="${{ steps.image.outputs.image }}"

          echo "=== Pulling $NEW_IMAGE on VPS ==="
          $SSH_CMD "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin && docker pull '$NEW_IMAGE'"

          echo "=== Updating ${{ env.SERVICE_NAME }} ==="
          $SSH_CMD "docker service update \
            --image '$NEW_IMAGE' \
            --update-order start-first \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            '${{ env.SERVICE_NAME }}'"

          $SSH_CMD "docker service ps '${{ env.SERVICE_NAME }}' --no-trunc"

      - name: Verify production health
        run: |
          set -euo pipefail
          for i in {1..20}; do
            code=$(curl -L -s -o /tmp/health.json -w '%{http_code}' '${{ env.PRODUCTION_URL }}/api/health' || true)
            cat /tmp/health.json || true
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Production health OK"
              exit 0
            fi
            echo "Health pending ($code), retry $i/20"
            sleep 10
          done
          echo "Production health failed"
          exit 1
