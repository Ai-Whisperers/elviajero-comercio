version: '3.8'
services:
  web:
    build: .
    image: elviajero-comercio:prod
    ports:
      - "3000"
    networks:
      - agent-net
    volumes:
      - viajero_data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/viajero.db
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.viajero.entrypoints=websecure"
        - "traefik.http.routers.viajero.rule=Host(`viajero.paragu-ai.com`) || Host(`el-viajero.paragu-ai.com`)"
        - "traefik.http.routers.viajero.tls=true"
        - "traefik.http.routers.viajero.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.viajero.loadbalancer.server.port=3000"
        - "traefik.docker.network=agent-net"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  viajero_data:
networks:
  agent-net:
    external: true
