version: '3.8'
services:
  web:
    build: .
    image: elviajero:prod
    ports:
      - "3000"
    networks:
      - agent-net
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://qyvokpribmbrosafntqa.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_KQ-sFNr7r6AauoG0B4nyTg_vuPHmeCm
      - SUPABASE_SERVICE_ROLE_KEY=sb_secret_J7n1igQHaVSKn35OrMe93A_p-_FEBvH
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.viajero.entrypoints=websecure"
        - "traefik.http.routers.viajero.rule=Host(`viajero.paragu-ai.com`) || Host(`el-viajero.paragu-ai.com`)"
        - "traefik.http.routers.viajero.tls=true"
        - "traefik.http.routers.viajero.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.viajero.loadbalancer.server.port=3000"
        - "traefik.docker.network=agent-net"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  agent-net:
    external: true
