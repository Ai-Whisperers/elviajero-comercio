version: '3.8'
services:
  web:
    build: .
    image: elviajero-comercio:prod
    ports:
      - "3000"
    networks:
      - agent-net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://qyvokpribmbrosafntqa.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5dm9rcHJpYm1icm9zYWZudHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ5MzU0OTQsImV4cCI6MjA2MDUxMTQ5NH0.cV8yF7fuylgLCLR4Hn3O2gQ8OAOhS7B7JmPUPw4SXRg
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5dm9rcHJpYm1icm9zYWZudHFhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NjMxODE1NSwiZXhwOjIwOTE4OTQxNTV9.rphBsAVMuI_2X8RCU7D0JiGd8pqqdpcQ7vpUrirU06g
      - NEXT_PUBLIC_BASE_URL=https://el-viajero.paragu-ai.com
      - PYG_PAYMENT_GATEWAY=pagopar
      # Payment keys — set these to activate real payments
      - PAGOPAR_PUBLIC_KEY=${PAGOPAR_PUBLIC_KEY}
      - PAGOPAR_PRIVATE_KEY=${PAGOPAR_PRIVATE_KEY}
      - BANCARD_PUBLIC_KEY=${BANCARD_PUBLIC_KEY}
      - BANCARD_PRIVATE_KEY=${BANCARD_PRIVATE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.viajero.entrypoints=websecure"
        - "traefik.http.routers.viajero.rule=Host(`viajero.paragu-ai.com`) || Host(`el-viajero.paragu-ai.com`)"
        - "traefik.http.routers.viajero.tls=true"
        - "traefik.http.routers.viajero.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.viajero.loadbalancer.server.port=3000"
        - "traefik.docker.network=agent-net"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  agent-net:
    external: true
