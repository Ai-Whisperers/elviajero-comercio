services:
  web:
    image: elviajero:prod-latest
    networks:
      - agent-net
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - NEXT_PUBLIC_BASE_URL=https://tiendaelviajero.com.py
      - NEXT_PUBLIC_SUPABASE_URL=https://qyvokpribmbrosafntqa.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_KQ-sFNr7r6AauoG0B4nyTg_vuPHmeCm
      - SUPABASE_SERVICE_ROLE_KEY=sb_secret_J7n1igQHaVSKn35OrMe93A_p-_FEBvH
      - EVOLUTION_API_URL=http://evolution_evolution_api:8080
      - EVOLUTION_API_KEY=a53c00...d0e1
      - EVOLUTION_INSTANCE=elviajero
      - ADMIN_WHATSAPP=595984009751
      - NEXT_PUBLIC_WHATSAPP=595984009751
      - ASSISTANT_LLM_BASE_URL=http://72.61.44.159:4000/v1
      - ASSISTANT_LLM_API_KEY=ollama-local
      - ASSISTANT_LLM_MODEL=llama-3.2-3b
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: "1.0"
          memory: 1GB
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.viajero.entrypoints=websecure
        - traefik.http.routers.viajero.rule=Host(`tiendaelviajero.com.py`) || Host(`www.tiendaelviajero.com.py`)
        - traefik.http.routers.viajero.tls=true
        - traefik.http.routers.viajero.tls.certresolver=letsencryptresolver
        - traefik.http.services.viajero.loadbalancer.server.port=3000
        - traefik.docker.network=agent-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  agent-net:
    external: true
