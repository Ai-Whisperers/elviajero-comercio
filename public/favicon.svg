<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Forest green background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#081C15"/>
    </linearGradient>
    <!-- Gold gradient for sun/compass accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <!-- Water/river blue -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Text shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#081C15" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: deep forest green rounded square -->
  <rect width="400" height="400" rx="72" fill="url(#bgGrad)"/>

  <!-- Subtle radial highlight at top -->
  <ellipse cx="200" cy="80" rx="160" ry="100" fill="white" opacity="0.03"/>

  <!-- Compass ring (outer) - gold -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.25"/>
  <!-- Compass ring (inner) -->
  <circle cx="200" cy="200" r="115" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>

  <!-- Cardinal direction marks (N/E/S/W) -->
  <!-- N mark -->
  <line x1="200" y1="68" x2="200" y2="82" stroke="#F9A825" stroke-width="3" opacity="0.6"/>
  <!-- E mark -->
  <line x1="332" y1="200" x2="318" y2="200" stroke="#F9A825" stroke-width="2" opacity="0.35"/>
  <!-- W mark -->
  <line x1="68" y1="200" x2="82" y2="200" stroke="#F9A825" stroke-width="2" opacity="0.35"/>
  <!-- S mark -->
  <line x1="200" y1="332" x2="200" y2="318" stroke="#F9A825" stroke-width="2" opacity="0.35"/>

  <!-- N label -->
  <text x="200" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#F9A825" opacity="0.55" letter-spacing="1">N</text>

  <!-- Water/river wave at bottom of compass -->
  <path d="M100 260 Q130 245 160 255 Q190 265 200 258 Q210 265 240 255 Q270 245 300 260 L300 290 Q270 275 240 285 Q210 295 200 288 Q190 295 160 285 Q130 275 100 290 Z" fill="url(#waterGrad)" opacity="0.55"/>

  <!-- Mountain peak 1 (left/back) - lower -->
  <polygon points="100,270 155,155 210,270" fill="white" opacity="0.12"/>

  <!-- Mountain peak 2 (center/main) - tallest -->
  <polygon points="135,275 200,108 265,275" fill="white" opacity="0.85"/>

  <!-- Mountain peak 3 (right/back) -->
  <polygon points="190,275 245,170 300,275" fill="white" opacity="0.25"/>

  <!-- Snow cap on main mountain -->
  <polygon points="200,108 181,155 200,145 219,155" fill="#A5D6A7" opacity="0.6"/>

  <!-- Trail/footpath winding up mountain -->
  <path d="M198 185 Q194 200 198 215 Q202 230 197 248 Q194 262 200 275"
        stroke="url(#goldGrad)" stroke-width="4" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Small campfire at trail start -->
  <g transform="translate(183, 278)" opacity="0.85">
    <!-- Campfire logs -->
    <line x1="0" y1="0" x2="-8" y2="6" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="6" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-5" y1="4" x2="5" y2="4" stroke="#6D4C41" stroke-width="2" stroke-linecap="round"/>
    <!-- Fire glow -->
    <ellipse cx="0" cy="-4" rx="6" ry="8" fill="#FF6D00" opacity="0.4"/>
    <!-- Flames -->
    <path d="M-3 0 Q0 -8 3 0" stroke="#F9A825" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0 0 Q2 -10 4 -2" stroke="#FF6D00" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M-4 0 Q-1 -6 1 -1" stroke="#F57F17" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Sun/star above main peak -->
  <g filter="url(#glow)" opacity="0.9">
    <!-- Sun rays -->
    <line x1="200" y1="72" x2="200" y2="60" stroke="#F9A825" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="92" x2="200" y2="104" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="172" y1="80" x2="163" y2="71" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="228" y1="80" x2="237" y2="71" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="174" y1="93" x2="166" y2="100" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="226" y1="93" x2="234" y2="100" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <!-- Sun circle -->
    <circle cx="200" cy="80" r="10" fill="url(#goldGrad)"/>
    <circle cx="200" cy="80" r="6" fill="#FFF59D" opacity="0.5"/>
  </g>

  <!-- Fish silhouette (hooks into the river/water theme) - subtle, bottom right -->
  <g transform="translate(270, 248) rotate(-25)" opacity="0.12">
    <path d="M0 0 Q15 -12 30 0 Q15 12 0 0" fill="white"/>
    <path d="M0 0 L-5 -8 Q-12 -4 -5 0" fill="white"/>
    <path d="M30 0 Q25 -4 22 -8" fill="none" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Pine tree silhouette left -->
  <g transform="translate(88, 252)" opacity="0.18">
    <polygon points="0,0 -12,28 12,28" fill="white"/>
    <polygon points="0,-14 -8,14 8,14" fill="white"/>
    <rect x="-3" y="28" width="6" height="8" fill="white"/>
  </g>

  <!-- Pine tree silhouette right -->
  <g transform="translate(312, 246)" opacity="0.15">
    <polygon points="0,0 -10,24 10,24" fill="white"/>
    <polygon points="0,-12 -7,12 7,12" fill="white"/>
    <rect x="-2.5" y="24" width="5" height="7" fill="white"/>
  </g>
</svg>