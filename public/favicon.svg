<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Rounded square base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Sun circle top-right -->
  <circle cx="48" cy="16" r="8" fill="#FFB300" opacity="0.25"/>
  <circle cx="48" cy="16" r="5" fill="#FFB300" opacity="0.5"/>
  <!-- Mountain range - back peak -->
  <path d="M8 54 L22 18 L36 54Z" fill="white" opacity="0.15"/>
  <!-- Mountain range - main peak (the V) -->
  <path d="M18 54 L34 14 L50 54Z" fill="white" opacity="0.95"/>
  <!-- Snow cap -->
  <path d="M34 14 L30 26 L38 26Z" fill="#C8E6C9"/>
  <!-- Trail path -->
  <path d="M36 26 Q40 32 38 38 Q36 44 40 50 Q41 52 39 54" stroke="url(#sun)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Small pine right side -->
  <polygon points="54,42 56,32 58,42" fill="white" opacity="0.2"/>
  <polygon points="52,48 56,38 60,48" fill="white" opacity="0.12"/>
</svg>
