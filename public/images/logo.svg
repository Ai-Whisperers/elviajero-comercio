<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#081C15"/>
    </linearGradient>
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="waterGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ICON: forest-green rounded square badge -->
  <rect x="0" y="0" width="120" height="120" rx="22" fill="url(#bgGradL)"/>
  <!-- Subtle top highlight -->
  <ellipse cx="60" cy="30" rx="45" ry="25" fill="white" opacity="0.04"/>

  <!-- Compass ring outer -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="url(#goldGradL)" stroke-width="1.5" opacity="0.3"/>
  <!-- Compass ring inner -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#goldGradL)" stroke-width="0.75" opacity="0.15"/>

  <!-- N/E/S/W marks -->
  <line x1="60" y1="16" x2="60" y2="22" stroke="#F9A825" stroke-width="1.5" opacity="0.5"/>
  <line x1="104" y1="60" x2="98" y2="60" stroke="#F9A825" stroke-width="1" opacity="0.3"/>
  <line x1="16" y1="60" x2="22" y2="60" stroke="#F9A825" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="104" x2="60" y2="98" stroke="#F9A825" stroke-width="1" opacity="0.3"/>
  <!-- N label small -->
  <text x="60" y="12" text-anchor="middle" font-family="Georgia, serif" font-size="6" font-weight="bold" fill="#F9A825" opacity="0.4" letter-spacing="0.5">N</text>

  <!-- Water wave at bottom -->
  <path d="M30 82 Q40 76 50 79 Q58 81 60 78 Q62 81 70 79 Q80 76 90 82 L90 95 Q80 89 70 92 Q62 94 60 91 Q58 94 50 92 Q40 89 30 95 Z" fill="url(#waterGradL)" opacity="0.5"/>

  <!-- Mountain back left -->
  <polygon points="28,82 50,45 72,82" fill="white" opacity="0.1"/>
  <!-- Mountain main center -->
  <polygon points="38,85 60,30 82,85" fill="white" opacity="0.85"/>
  <!-- Mountain back right -->
  <polygon points="55,85 70,55 85,85" fill="white" opacity="0.2"/>

  <!-- Snow cap -->
  <polygon points="60,30 54,46 60,41 66,46" fill="#A5D6A7" opacity="0.55"/>

  <!-- Trail path -->
  <path d="M59 55 Q56 63 59 72 Q61 79 58 85" stroke="url(#goldGradL)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- Campfire -->
  <g transform="translate(52, 87)" opacity="0.8">
    <line x1="0" y1="0" x2="-5" y2="4" stroke="#8D6E63" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="4" stroke="#8D6E63" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-2" rx="3.5" ry="5" fill="#FF6D00" opacity="0.35"/>
    <path d="M-2 0 Q0 -5 2 0" stroke="#F9A825" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sun above peak -->
  <g filter="url(#glowL)" opacity="0.85">
    <line x1="60" y1="18" x2="60" y2="13" stroke="#F9A825" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="22" x2="44" y2="18" stroke="#F9A825" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="22" x2="76" y2="18" stroke="#F9A825" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <circle cx="60" cy="24" r="5.5" fill="url(#goldGradL)"/>
    <circle cx="60" cy="24" r="3" fill="#FFF59D" opacity="0.4"/>
  </g>

  <!-- Pine trees sides -->
  <polygon points="20,80 15,65 25,65" fill="white" opacity="0.15"/>
  <polygon points="18,85 12,72 24,72" fill="white" opacity="0.1"/>
  <polygon points="100,78 95,63 105,63" fill="white" opacity="0.12"/>
  <polygon points="102,83 96,70 108,70" fill="white" opacity="0.1"/>

  <!-- Fish silhouette bottom right -->
  <g transform="translate(85, 78) rotate(-30)" opacity="0.1">
    <path d="M0 0 Q8 -6 16 0 Q8 6 0 0" fill="white"/>
    <path d="M0 0 L-3 -4 Q-6 -2 -3 0" fill="white"/>
  </g>

  <!-- TEXT SECTION -->
  <!-- El -->
  <text x="138" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" font-style="italic" fill="#1B4332" letter-spacing="-1">El</text>

  <!-- Viajero - the standout word -->
  <text x="138" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold" font-style="italic" fill="#1B4332" letter-spacing="-2">Viajero</text>

  <!-- Tagline -->
  <text x="140" y="115" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="3.5">CAMPING · PESCA · OUTDOOR</text>

  <!-- Gold accent underline on Viajero -->
  <rect x="198" y="102" width="140" height="2" rx="1" fill="url(#goldGradL)" opacity="0.6"/>
</svg>