<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="logomount" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <linearGradient id="logotrail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="logobg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>
  <!-- Icon badge -->
  <rect x="2" y="4" width="56" height="56" rx="12" fill="url(#logobg)" stroke="#C8E6C9" stroke-width="1"/>
  <!-- Back mountain -->
  <path d="M10 54 L22 20 L34 54Z" fill="#1B5E20" opacity="0.15"/>
  <!-- Main mountain V -->
  <path d="M14 54 L30 12 L46 54Z" fill="url(#logomount)"/>
  <!-- Snow cap -->
  <path d="M30 12 L26 24 L34 24Z" fill="white" opacity="0.9"/>
  <!-- Trail -->
  <path d="M32 24 Q36 30 34 36 Q32 42 36 48 Q37 50 35 54" stroke="url(#logotrail)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Sun dot -->
  <circle cx="48" cy="14" r="4" fill="#FFB300" opacity="0.4"/>
  <circle cx="48" cy="14" r="2.5" fill="#FFB300" opacity="0.6"/>
  <!-- Pine -->
  <polygon points="50,44 52,36 54,44" fill="#1B5E20" opacity="0.25"/>
  <!-- Brand name -->
  <text x="68" y="32" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#1B5E20" letter-spacing="-0.5">El Viajero</text>
  <!-- Tagline -->
  <text x="68" y="48" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" fill="#558B2F" opacity="0.7" letter-spacing="0.5">CAMPING · PESCA · OUTDOOR · PARAGUAY</text>
</svg>
