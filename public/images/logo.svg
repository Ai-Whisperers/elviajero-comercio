<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Mountain icon -->
  <defs>
    <linearGradient id="mountGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <!-- Back mountain -->
  <path d="M5 45 L18 18 L31 45Z" fill="#1565C0" opacity="0.3"/>
  <!-- Front mountain -->
  <path d="M12 45 L28 12 L44 45Z" fill="url(#mountGrad)"/>
  <!-- Snow cap -->
  <path d="M28 12 L24 22 L32 22Z" fill="white" opacity="0.6"/>
  <!-- Sun -->
  <circle cx="38" cy="10" r="4" fill="#FFB300" opacity="0.5"/>
  <!-- Tent silhouette -->
  <path d="M30 38 L36 28 L42 38Z" fill="#37474F"/>
  <path d="M33 38 L36 32 L39 38Z" fill="white" opacity="0.3"/>
  <!-- Tree -->
  <rect x="2" y="30" width="2" height="8" fill="#37474F"/>
  <polygon points="1,30 3,22 5,30" fill="#1B5E20" opacity="0.7"/>
  <!-- Title -->
  <text x="52" y="32" font-family="'Poppins',sans-serif" font-size="20" font-weight="700" fill="#1B5E20">El Viajero</text>
  <!-- Tagline -->
  <text x="52" y="46" font-family="'Inter',sans-serif" font-size="10" fill="#37474F">Todo para tu aventura</text>
</svg>
