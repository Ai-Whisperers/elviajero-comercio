<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e879f9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.4" flood-color="#000"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="600" height="900" fill="url(#bg)" rx="8"/>

  <!-- Decorative overlay -->
  <rect width="600" height="900" fill="url(#glow)" rx="8"/>

  <!-- Subtle texture lines -->
  <g opacity="0.04">
        <line x1="0" y1="0" x2="600" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="600" y2="30" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="600" y2="60" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="600" y2="90" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="600" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="600" y2="210" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="600" y2="270" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="330" x2="600" y2="330" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="600" y2="390" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="600" y2="420" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="600" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="600" y2="480" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="510" x2="600" y2="510" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="600" y2="540" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="570" x2="600" y2="570" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="600" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="660" x2="600" y2="660" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="690" x2="600" y2="690" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="720" x2="600" y2="720" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="750" x2="600" y2="750" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="780" x2="600" y2="780" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="810" x2="600" y2="810" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="840" x2="600" y2="840" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="870" x2="600" y2="870" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="900" x2="600" y2="900" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Border frame -->
  <rect x="20" y="20" width="560" height="860" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="4"/>
  <rect x="30" y="30" width="540" height="840" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" rx="3"/>

  <!-- Decorative top element -->
  <ellipse cx="300" cy="250" rx="200" ry="120" fill="#e879f9" opacity="0.08"/>
  <ellipse cx="300" cy="550" rx="180" ry="100" fill="#e879f9" opacity="0.05"/>

  <!-- Genre badge -->
  <rect x="220" y="420" width="160" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <text x="300" y="439" text-anchor="middle" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="rgba(255,255,255,0.7)" text-transform="uppercase">FANTASÍA JUVENIL</text>

  <!-- Title -->
  <text x="300" y="510" text-anchor="middle" font-family="'Playfair Display','Georgia',serif" font-size="36" font-weight="700" fill="#f3e8ff" filter="url(#shadow)">Alas de Cristal</text>

  <!-- Subtitle / author -->
  <text x="300" y="550" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="2">Una novela de</text>

  <!-- Bottom decorative line -->
  <line x1="200" y1="575" x2="400" y2="575" stroke="#e879f9" stroke-width="1" opacity="0.3"/>

  <!-- Price badge -->
  <rect x="250" y="620" width="100" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="300" y="641" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.6)">FANTASÍA JUVENIL PREMADE</text>

  <!-- Dayah watermark -->
  <text x="300" y="860" text-anchor="middle" font-family="'Inter',sans-serif" font-size="9" font-weight="300" fill="rgba(255,255,255,0.2)" letter-spacing="4">DAYAH LITWORKS</text>
</svg>